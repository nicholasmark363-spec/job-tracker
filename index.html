<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Analyst / Data Scientist Job Tracker</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161923; --panel2:#1d2130; --border:#2a2f3f;
    --text:#e8e9ee; --muted:#9aa0b4; --accent:#6c8cff; --accent2:#3ddc97;
    --danger:#ff6b6b; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text);
  }
  header{
    padding:24px 32px; border-bottom:1px solid var(--border);
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
  }
  header h1{ margin:0; font-size:20px; }
  header .meta{ color:var(--muted); font-size:13px; }
  .controls{
    display:flex; gap:10px; padding:18px 32px; flex-wrap:wrap;
    border-bottom:1px solid var(--border); background:var(--panel);
  }
  input, select{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:9px 12px; border-radius:8px; font-size:14px;
  }
  input[type="text"]{ flex:1; min-width:220px; }
  .stat-pill{
    background:var(--panel2); border:1px solid var(--border); border-radius:20px;
    padding:8px 14px; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px;
  }
  main{ padding:24px 32px; max-width:1100px; margin:0 auto; }
  .job-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:14px; display:flex; justify-content:space-between; gap:16px;
    align-items:flex-start; transition:opacity .15s;
  }
  .job-card.applied{ opacity:0.45; }
  .job-info{ flex:1; min-width:0; }
  .job-title{ font-size:16px; font-weight:600; margin:0 0 4px 0; }
  .job-title a{ color:var(--text); text-decoration:none; }
  .job-title a:hover{ color:var(--accent); }
  .job-sub{ color:var(--muted); font-size:13.5px; margin-bottom:8px; }
  .tags{ display:flex; gap:6px; flex-wrap:wrap; }
  .tag{
    font-size:11.5px; padding:3px 9px; border-radius:12px; border:1px solid var(--border);
    color:var(--muted);
  }
  .tag.role{ color:var(--accent); border-color:var(--accent); }
  .job-actions{ display:flex; flex-direction:column; gap:8px; align-items:flex-end; min-width:130px; }
  button{
    cursor:pointer; border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600;
  }
  .btn-apply{ background:var(--accent2); color:#08231a; }
  .btn-applied{ background:var(--panel2); color:var(--muted); border:1px solid var(--border); }
  .btn-hide{ background:transparent; color:var(--danger); border:1px solid var(--border); }
  .empty{ text-align:center; color:var(--muted); padding:60px 20px; }
  footer{ text-align:center; color:var(--muted); font-size:12px; padding:30px; }
  a.setup-link{ color:var(--accent); }
</style>
</head>
<body>

<header>
  <div>
    <h1>📊 Data Analyst / Data Scientist Jobs</h1>
    <div class="meta" id="lastUpdated">Loading...</div>
  </div>
  <div class="stat-pill" id="statPill">— jobs</div>
</header>

<div class="controls">
  <input type="text" id="searchBox" placeholder="Search title, company, location...">
  <select id="roleFilter">
    <option value="">All roles</option>
    <option value="Data Analyst">Data Analyst</option>
    <option value="Data Scientist">Data Scientist</option>
  </select>
  <select id="countryFilter">
    <option value="">All locations</option>
  </select>
  <select id="statusFilter">
    <option value="all">Show all</option>
    <option value="not-applied">Not applied only</option>
    <option value="applied">Applied only</option>
  </select>
</div>

<main id="jobList"></main>

<footer>
  Data from Adzuna &amp; Remotive · Updates daily via GitHub Actions · Applied status stored locally in this browser only
</footer>

<script>
const APPLIED_KEY = 'job_tracker_applied_v1';
const HIDDEN_KEY = 'job_tracker_hidden_v1';

function getApplied(){
  return JSON.parse(localStorage.getItem(APPLIED_KEY) || '{}');
}
function setApplied(map){
  localStorage.setItem(APPLIED_KEY, JSON.stringify(map));
}
function getHidden(){
  return JSON.parse(localStorage.getItem(HIDDEN_KEY) || '{}');
}
function setHidden(map){
  localStorage.setItem(HIDDEN_KEY, JSON.stringify(map));
}

let allJobs = [];

async function loadJobs(){
  try{
    const res = await fetch('jobs.json?_=' + Date.now());
    const data = await res.json();
    allJobs = data.jobs || [];
    document.getElementById('lastUpdated').textContent = data.last_updated
      ? 'Last updated: ' + new Date(data.last_updated).toLocaleString()
      : 'Not updated yet — run the GitHub Action or fetch-jobs.js locally';
    populateCountryFilter();
    render();
  }catch(err){
    document.getElementById('jobList').innerHTML =
      '<div class="empty">Could not load jobs.json. Make sure it is in the same folder as this file, or run the fetch script.</div>';
  }
}

function populateCountryFilter(){
  const sel = document.getElementById('countryFilter');
  const countries = [...new Set(allJobs.map(j => j.country).filter(Boolean))].sort();
  for(const c of countries){
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  }
}

function render(){
  const q = document.getElementById('searchBox').value.toLowerCase();
  const role = document.getElementById('roleFilter').value;
  const country = document.getElementById('countryFilter').value;
  const status = document.getElementById('statusFilter').value;
  const applied = getApplied();
  const hidden = getHidden();

  let filtered = allJobs.filter(j => !hidden[j.id]);

  if(q){
    filtered = filtered.filter(j =>
      (j.title||'').toLowerCase().includes(q) ||
      (j.company||'').toLowerCase().includes(q) ||
      (j.location||'').toLowerCase().includes(q)
    );
  }
  if(role) filtered = filtered.filter(j => j.role_type === role);
  if(country) filtered = filtered.filter(j => j.country === country);
  if(status === 'applied') filtered = filtered.filter(j => applied[j.id]);
  if(status === 'not-applied') filtered = filtered.filter(j => !applied[j.id]);

  document.getElementById('statPill').textContent =
    `${filtered.length} of ${allJobs.length} jobs`;

  const list = document.getElementById('jobList');
  if(filtered.length === 0){
    list.innerHTML = '<div class="empty">No jobs match your filters.</div>';
    return;
  }

  list.innerHTML = filtered.map(j => {
    const isApplied = !!applied[j.id];
    return `
    <div class="job-card ${isApplied ? 'applied' : ''}">
      <div class="job-info">
        <p class="job-title"><a href="${j.url}" target="_blank" rel="noopener">${escapeHtml(j.title)}</a></p>
        <div class="job-sub">${escapeHtml(j.company)} · ${escapeHtml(j.location)} ${j.posted_date ? '· ' + j.posted_date : ''}</div>
        <div class="tags">
          <span class="tag role">${j.role_type || ''}</span>
          <span class="tag">${j.source}</span>
          ${j.salary_min ? `<span class="tag">₹/$${Math.round(j.salary_min)}+</span>` : ''}
        </div>
      </div>
      <div class="job-actions">
        <button class="${isApplied ? 'btn-applied' : 'btn-apply'}" onclick="toggleApplied('${j.id}')">
          ${isApplied ? '✓ Applied' : 'Mark Applied'}
        </button>
        <button class="btn-hide" onclick="hideJob('${j.id}')">Hide</button>
      </div>
    </div>`;
  }).join('');
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toggleApplied(id){
  const applied = getApplied();
  if(applied[id]) delete applied[id];
  else applied[id] = { date: new Date().toISOString().slice(0,10) };
  setApplied(applied);
  render();
}

function hideJob(id){
  const hidden = getHidden();
  hidden[id] = true;
  setHidden(hidden);
  render();
}

['searchBox','roleFilter','countryFilter','statusFilter'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});

loadJobs();
</script>
</body>
</html>
